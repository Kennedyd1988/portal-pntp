<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script>/* Endereço oficial da plataforma: o antigo (GitHub Pages) leva ao mesmo lugar na Cloudflare. */
if (location.hostname === 'kennedyd1988.github.io') location.replace('https://portal-pntp.pages.dev' + location.pathname.replace(/^\/portal-pntp/, '') + location.search + location.hash);</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal PNTP · SOFT+</title>
<link rel="icon" type="image/png" href="icon-192.png">
<!-- Raiz: no domínio de um órgão (ex.: riachodacruz.rn.gov.br) abre o site dele;
     nos endereços da plataforma (GitHub Pages, Cloudflare Pages, localhost) abre o painel. -->
<script>
  (function () {
    var h = location.hostname;
    var plataforma = /(^|\.)github\.io$|(^|\.)pages\.dev$|^localhost$|^127\.0\.0\.1$/.test(h) || /^painel\./.test(h);
    location.replace((plataforma ? 'painel/' : 'site/') + location.search + location.hash);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=site/"></noscript>
</head>
<body>
<p><a href="site/">Abrir o site</a> · <a href="painel/">Abrir o painel</a></p>
</body>
</html>
